  /api/activities/{activityId}/vote-history:
    get:
      tags: [Sprint 2 活动查询]
      summary: 查询历史投票
      operationId: getVoteHistory
      description: 活动成员可查询已归档的轮次、候选摘要、汇总票数和获胜候选。轮次结束、被新推荐替代或零票重投时保存汇总。
      parameters:
      - {$ref: '#/components/parameters/ActivityId'}
      responses:
        '200':
          description: 按活动返回历史轮次汇总
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, enum: [true]}
                  message: {type: string}
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/RoundHistoryItem'}}
              examples:
                superseded:
                  summary: 已有历史轮次
                  value:
                    success: true
                    data:
                      items:
                      - round: 1
                        status: superseded
                        startedAt: 1793680000000
                        endedAt: 1793766400000
                        candidates:
                        - {id: c_1_B0A1, placeId: B0A1, name: 静安嘉里中心, score: 8.9, overallRank: 1}
                        voteCounts: {c_1_B0A1: 2}
                        winningCandidateId: null
                empty:
                  summary: 暂无历史轮次
                  value: {success: true, data: {items: []}}
        '401':
          description: 缺少或无效的 Bearer 令牌
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                UNAUTHORIZED:
                  summary: 活动令牌缺失或无效
                  value: {success: false, error: {code: UNAUTHORIZED, message: 活动令牌缺失或无效, retryable: false}}
        '403':
          description: 当前身份无权限
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                NOT_ACTIVITY_MEMBER:
                  summary: 当前身份不是活动成员
                  value: {success: false, error: {code: NOT_ACTIVITY_MEMBER, message: 当前身份不是活动成员, retryable: false}}
