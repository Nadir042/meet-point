        '400':
          description: 请求字段有误或前置资料不完整
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                INVALID_REQUEST:
                  summary: 请检查必填字段和字段格式
                  value: {success: false, error: {code: INVALID_REQUEST, message: 请检查必填字段和字段格式, retryable: false}}
                INSUFFICIENT_ORIGINS:
                  summary: 有成员未填写有效出发地
                  value: {success: false, error: {code: INSUFFICIENT_ORIGINS, message: 有成员未填写有效出发地, retryable: false}}
                REJECT_REASON_REQUIRED:
                  summary: 请填写拒绝原因
                  value: {success: false, error: {code: REJECT_REASON_REQUIRED, message: 请填写拒绝原因, retryable: false}}
        '401':
          description: 缺少或无效的 Bearer 令牌
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                UNAUTHORIZED:
                  summary: 活动令牌缺失或无效
                  value: {success: false, error: {code: UNAUTHORIZED, message: 活动令牌缺失或无效, retryable: false}}
        '403':
          description: 当前身份无权限
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                NOT_ACTIVITY_MEMBER:
                  summary: 当前身份不是活动成员
                  value: {success: false, error: {code: NOT_ACTIVITY_MEMBER, message: 当前身份不是活动成员, retryable: false}}
                NOT_INITIATOR:
                  summary: 仅活动发起者可执行此操作
                  value: {success: false, error: {code: NOT_INITIATOR, message: 仅活动发起者可执行此操作, retryable: false}}
        '404':
          description: 请求的资源不存在或已失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                ACTIVITY_NOT_FOUND:
                  summary: 活动不存在
                  value: {success: false, error: {code: ACTIVITY_NOT_FOUND, message: 活动不存在, retryable: false}}
                CANDIDATE_NOT_IN_ROUND:
                  summary: 候选不属于当前轮次
                  value: {success: false, error: {code: CANDIDATE_NOT_IN_ROUND, message: 候选不属于当前轮次, retryable: false}}
                REQUEST_NOT_FOUND:
                  summary: 申请不存在或已失效
                  value: {success: false, error: {code: REQUEST_NOT_FOUND, message: 申请不存在或已失效, retryable: false}}
        '409':
          description: 当前活动或轮次状态冲突
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                ROUND_STALE:
                  summary: 推荐方案已更新，请刷新
                  value: {success: false, error: {code: ROUND_STALE, message: 推荐方案已更新，请刷新, retryable: false}}
                VOTING_CLOSED:
                  summary: 投票已截止
                  value: {success: false, error: {code: VOTING_CLOSED, message: 投票已截止, retryable: false}}
                ACTIVITY_PAUSED:
                  summary: 活动已暂停
                  value: {success: false, error: {code: ACTIVITY_PAUSED, message: 活动已暂停, retryable: false}}
                ACTIVITY_COMPLETED:
                  summary: 活动已完成
                  value: {success: false, error: {code: ACTIVITY_COMPLETED, message: 活动已完成, retryable: false}}
                ACTIVITY_CANCELLED:
                  summary: 活动已取消
                  value: {success: false, error: {code: ACTIVITY_CANCELLED, message: 活动已取消, retryable: false}}
                NOT_ALL_VOTED:
                  summary: 尚未全员投票
                  value: {success: false, error: {code: NOT_ALL_VOTED, message: 尚未全员投票, retryable: false}}
                NOT_ZERO_VOTES:
                  summary: 当前轮次存在有效选票
                  value: {success: false, error: {code: NOT_ZERO_VOTES, message: 当前轮次存在有效选票, retryable: false}}
                REQUEST_ALREADY_HANDLED:
                  summary: 申请已经处理
                  value: {success: false, error: {code: REQUEST_ALREADY_HANDLED, message: 申请已经处理, retryable: false}}
                NO_CANDIDATES:
                  summary: 当前没有可用候选
                  value: {success: false, error: {code: NO_CANDIDATES, message: 当前没有可用候选, retryable: false}}
        '429':
          description: 地图配额受限
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                MAP_QUOTA_EXCEEDED:
                  summary: 地图配额用尽
                  value: {success: false, error: {code: MAP_QUOTA_EXCEEDED, message: 地图配额用尽, retryable: false}}
        '502':
          description: 地图或路线服务返回异常
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                MAP_PROVIDER_ERROR:
                  summary: 地图服务返回异常
                  value: {success: false, error: {code: MAP_PROVIDER_ERROR, message: 地图服务返回异常, retryable: true}}
                ROUTES_UNAVAILABLE:
                  summary: 所有候选路线失败
                  value: {success: false, error: {code: ROUTES_UNAVAILABLE, message: 所有候选路线失败, retryable: true}}
        '504':
          description: 地图服务超时
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                MAP_TIMEOUT:
                  summary: 地图服务超时
                  value: {success: false, error: {code: MAP_TIMEOUT, message: 地图服务超时, retryable: true}}
components:
  securitySchemes:
    activityBearer:
      type: http
      scheme: bearer
      description: 活动或账号 Bearer 令牌，由后端判定身份。
  parameters:
    ActivityId:
      name: activityId
      in: path
      required: true
      description: 活动 ID
      schema: {type: string}
      example: 00000000-0000-4000-8000-000000000001
  schemas:
    Location:
      type: object
      required: [provider, placeId, name, address, category, lng, lat]
      properties:
        provider: {type: string, enum: [amap]}
        placeId: {type: string}
        name: {type: string}
        address: {type: string}
        category: {type: string}
        lng: {type: number, minimum: -180, maximum: 180, description: GCJ-02 经度}
        lat: {type: number, minimum: -90, maximum: 90, description: GCJ-02 纬度}
    Route:
      type: object
      required: [memberId, mode, minutes, distanceMeters, cost, costStatus]
      properties:
        memberId: {type: string}
        mode: {type: string, enum: [公共交通, 驾车, 步行, 骑行]}
        minutes: {type: number, minimum: 0}
        distanceMeters: {type: integer, minimum: 0}
        cost: {type: number, minimum: 0, nullable: true, description: 人民币元，仅 costStatus 为 known 时为数值}
        costStatus: {type: string, enum: [known, unknown, unavailable, not_applicable]}
    RouteSummary:
      type: object
      required: [averageMinutes, minMinutes, maxMinutes, gapMinutes]
      properties:
        averageMinutes: {type: number, minimum: 0}
        minMinutes: {type: number, minimum: 0}
        maxMinutes: {type: number, minimum: 0}
        gapMinutes: {type: number, minimum: 0}
    ScoreDimensions:
      type: object
      properties:
        fairness: {type: number, minimum: 0}
        time: {type: number, minimum: 0}
        preference: {type: number, minimum: 0}
        convenience: {type: number, minimum: 0}
      description: 有效维度等权平均；缺少可靠数据的维度可省略
    Candidate:
      type: object
      required: [id, round, provider, placeId, name, address, category, lng, lat, routes, routeSummary, dimensions, score,
        overallRank, reasons]
      properties:
        id: {type: string, pattern: '^c_[1-9][0-9]*_.+$', description: 'c_{round}_{placeId}'}
        round: {type: integer, minimum: 1}
        provider: {type: string, enum: [amap]}
        placeId: {type: string}
        name: {type: string}
        address: {type: string}
        category: {type: string}
        lng: {type: number, minimum: -180, maximum: 180, description: GCJ-02 经度}
        lat: {type: number, minimum: -90, maximum: 90, description: GCJ-02 纬度}
        routes: {type: array, items: {$ref: '#/components/schemas/Route'}, description: 仅含本人及公开出发地成员的路线}
        routeSummary: {$ref: '#/components/schemas/RouteSummary'}
        dimensions: {$ref: '#/components/schemas/ScoreDimensions'}
        score: {type: number, minimum: 0}
        overallRank: {type: integer, minimum: 1}
        reasons: {type: array, items: {type: string}, description: 理由不包含成员姓名或私人出发地信息}
    RecommendationGroups:
      type: object
      properties:
        fairness: {type: array, items: {type: string, pattern: '^c_[1-9][0-9]*_.+$', description: 'c_{round}_{placeId}'},
          maxItems: 3, uniqueItems: true}
        preference: {type: array, items: {type: string, pattern: '^c_[1-9][0-9]*_.+$', description: 'c_{round}_{placeId}'},
          maxItems: 3, uniqueItems: true}
        convenience: {type: array, items: {type: string, pattern: '^c_[1-9][0-9]*_.+$', description: 'c_{round}_{placeId}'},
          maxItems: 3, uniqueItems: true}
      description: 每组按对应维度排序，同一候选可跨组出现；尚未推荐时允许空对象
    Recommendation:
      type: object
      required: [round, groups, candidates, warnings]
      properties:
        round: {type: integer, minimum: 1}
        groups: {$ref: '#/components/schemas/RecommendationGroups'}
        candidates: {type: array, items: {$ref: '#/components/schemas/Candidate'}}
        warnings: {type: array, items: {}, description: 推荐警告；条目结构以服务端联调为准}
    VoteStatus:
      type: object
      required: [round, status, paused, deadline, remainingMs, totalMembers, votedMembers, myVote, voteCounts, allVoted, winningCandidateId]
      properties:
        round: {type: integer, minimum: 0}
        status: {type: string, enum: [collecting, voting, no-votes, completed, cancelled]}
        paused: {type: boolean}
        deadline: {type: integer, format: int64, minimum: 0, description: Unix 毫秒, nullable: true}
        remainingMs: {type: integer, format: int64, minimum: 0, nullable: true, description: 暂停时的剩余毫秒数}
        totalMembers: {type: integer, minimum: 0}
        votedMembers: {type: integer, minimum: 0}
        myVote: {type: string, pattern: '^c_[1-9][0-9]*_.+$', description: 'c_{round}_{placeId}', nullable: true}
        voteCounts: {type: object, additionalProperties: {type: integer, minimum: 0}, description: 键为本轮候选 ID，值为该候选的汇总票数}
        allVoted: {type: boolean}
        winningCandidateId: {type: string, pattern: '^c_[1-9][0-9]*_.+$', description: 'c_{round}_{placeId}', nullable: true}
    HistoryCandidate:
      type: object
      required: [id, placeId, name, score, overallRank]
      properties:
        id: {type: string, pattern: '^c_[1-9][0-9]*_.+$', description: 'c_{round}_{placeId}'}
        placeId: {type: string}
        name: {type: string}
        score: {type: number, minimum: 0}
        overallRank: {type: integer, minimum: 1}
      additionalProperties: false
    RoundHistoryItem:
      type: object
      required: [round, status, startedAt, endedAt, candidates, voteCounts, winningCandidateId]
      properties:
        round: {type: integer, minimum: 1}
        status: {type: string, description: 历史轮次状态，例如 superseded}
        startedAt: {type: integer, format: int64, minimum: 0, description: Unix 毫秒}
        endedAt: {type: integer, format: int64, minimum: 0, description: Unix 毫秒}
        candidates: {type: array, items: {$ref: '#/components/schemas/HistoryCandidate'}}
        voteCounts: {type: object, additionalProperties: {type: integer, minimum: 0}, description: 键为本轮候选 ID，值为该候选的汇总票数}
        winningCandidateId: {type: string, pattern: '^c_[1-9][0-9]*_.+$', description: 'c_{round}_{placeId}', nullable: true}
      additionalProperties: false
    Member:
      type: object
      required: [id, origin, originReady]
      properties:
        id: {type: string}
        name: {type: string}
        origin:
          oneOf:
          - {$ref: '#/components/schemas/Location'}
          - {type: object, nullable: true, enum: [null]}
        originReady: {type: boolean, description: 已填写有效出发地；对其他成员隐藏出发地时也可为 true}
        shared: {type: boolean}
    Activity:
      type: object
      required: [id, status, paused, round, deadline, remainingMs, winningCandidateId, members, candidates, groups, requests,
        voteStatus]
      properties:
        id: {type: string}
        status: {type: string, enum: [collecting, voting, no-votes, completed, cancelled]}
        paused: {type: boolean}
        round: {type: integer, minimum: 0}
        deadline: {type: integer, format: int64, minimum: 0, description: Unix 毫秒, nullable: true}
        remainingMs: {type: integer, format: int64, minimum: 0, nullable: true, description: 暂停时的剩余毫秒数}
        winningCandidateId: {type: string, pattern: '^c_[1-9][0-9]*_.+$', description: 'c_{round}_{placeId}', nullable: true}
        members: {type: array, items: {$ref: '#/components/schemas/Member'}}
        candidates: {type: array, items: {$ref: '#/components/schemas/Candidate'}}
        groups: {$ref: '#/components/schemas/RecommendationGroups'}
        requests: {type: array, items: {type: object, description: 重新推荐申请；字段细节以服务端联调为准}}
        voteStatus: {$ref: '#/components/schemas/VoteStatus'}
      description: 当前请求者看到的活动。隐藏其他成员的私人出发地、个人路线与逐人投票。
    ActivityResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        message: {type: string}
        data:
          type: object
          required: [activity]
          properties:
            activity: {$ref: '#/components/schemas/Activity'}
    RequirementsInput:
      type: object
      required: [origin, mode, preference, budget, shared]
      properties:
        origin: {$ref: '#/components/schemas/Location'}
        mode: {type: string, enum: [公共交通, 驾车, 步行, 骑行]}
        preference: {type: string, description: 按活动类型选择，取值见接口说明}
        budget: {type: number, minimum: 0, description: 预算，单位人民币元}
        shared: {type: boolean, description: 是否向其他成员公开出发地}
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: {type: boolean, enum: [false]}
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
