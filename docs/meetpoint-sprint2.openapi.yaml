  /api/activities/{activityId}/actions:
    post:
      tags: [Sprint 2 活动操作]
      summary: 执行活动操作
      operationId: actOnActivity
      description: |-
        按 action 区分操作，沿用同一 HTTP 入口。推荐的正常完成时间目标为 10 秒。综合评分对公平性、整体耗时、偏好匹配与交通便利等权平均，缺失数据时按有效维度平均。预算在有可靠消费数据时纳入偏好。候选任一成员路线失败则不参与评分；无可用候选时保留原轮次。

        - **首次推荐** — 发起者执行。需要 2～10 名有效成员且需求完整。推荐成功才增加轮次，开启 24 小时投票。地图或路线失败时保留原轮次。
        - **投票或改票** — 校验 round 与 candidateId。重复提交更新本人选票，身份由 Bearer 令牌确定。
        - **申请重新推荐** — 每名成员每轮至多一条待处理申请；被拒绝后可以再次申请。
        - **批准重新推荐** — 仅发起者可审批。先执行真实推荐，成功后归档旧轮次并开始新轮次。
        - **拒绝重新推荐** — 仅发起者可审批，拒绝必须填写原因。
        - **提前结束投票** — 仅发起者可在全员投票后提前结束。与到期自动计票使用相同规则，平票按 overallRank 决定。
        - **零票重投** — 仅发起者可在当前轮次到期且有效票数为零后执行。归档旧轮次，复用地点、路线、评分和排名，生成新候选 ID，开启 24 小时投票。
        - **暂停** — 仅发起者可操作。保存 remainingMs = deadline - now，暂停投票、改票、推荐及自动计票。
        - **恢复** — 仅发起者可操作。恢复时按 deadline = now + remainingMs 重设截止时间。
      parameters:
      - {$ref: '#/components/parameters/ActivityId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - title: 首次推荐
                description: 发起者执行。需要 2～10 名有效成员且需求完整。推荐成功才增加轮次，开启 24 小时投票。地图或路线失败时保留原轮次。
                type: object
                required: [action, data]
                properties:
                  action: {type: string, enum: [recommend]}
                  data: {type: object, additionalProperties: false}
                additionalProperties: false
              - title: 投票或改票
                description: 校验 round 与 candidateId。重复提交更新本人选票，身份由 Bearer 令牌确定。
                type: object
                required: [action, data]
                properties:
                  action: {type: string, enum: [vote]}
                  data:
                    type: object
                    required: [round, candidateId]
                    properties:
                      round: {type: integer, minimum: 1}
                      candidateId: {type: string, pattern: '^c_[1-9][0-9]*_.+$', description: 'c_{round}_{placeId}'}
                    additionalProperties: false
                additionalProperties: false
              - title: 申请重新推荐
                description: 每名成员每轮至多一条待处理申请；被拒绝后可以再次申请。
                type: object
                required: [action, data]
                properties:
                  action: {type: string, enum: [request]}
                  data:
                    type: object
                    required: [round, reason]
                    properties:
                      round: {type: integer, minimum: 1}
                      reason: {type: string, minLength: 1}
                    additionalProperties: false
                additionalProperties: false
              - title: 批准重新推荐
                description: 仅发起者可审批。先执行真实推荐，成功后归档旧轮次并开始新轮次。
                type: object
                required: [action, data]
                properties:
                  action: {type: string, enum: [review-request]}
                  data:
                    type: object
                    required: [requestId, decision]
                    properties:
                      requestId: {type: string}
                      decision: {type: string, enum: [approved]}
                    additionalProperties: false
                additionalProperties: false
              - title: 拒绝重新推荐
                description: 仅发起者可审批，拒绝必须填写原因。
                type: object
                required: [action, data]
                properties:
                  action: {type: string, enum: [review-request]}
                  data:
                    type: object
                    required: [requestId, decision, reason]
                    properties:
                      requestId: {type: string}
                      decision: {type: string, enum: [rejected]}
                      reason: {type: string, minLength: 1}
                    additionalProperties: false
                additionalProperties: false
              - title: 提前结束投票
                description: 仅发起者可在全员投票后提前结束。与到期自动计票使用相同规则，平票按 overallRank 决定。
                type: object
                required: [action, data]
                properties:
                  action: {type: string, enum: [finish]}
                  data:
                    type: object
                    required: [round]
                    properties:
                      round: {type: integer, minimum: 1}
                    additionalProperties: false
                additionalProperties: false
              - title: 零票重投
                description: 仅发起者可在当前轮次到期且有效票数为零后执行。归档旧轮次，复用地点、路线、评分和排名，生成新候选 ID，开启 24 小时投票。
                type: object
                required: [action, data]
                properties:
                  action: {type: string, enum: [revote]}
                  data:
                    type: object
                    required: [round]
                    properties:
                      round: {type: integer, minimum: 1}
                    additionalProperties: false
                additionalProperties: false
              - title: 暂停
                description: 仅发起者可操作。保存 remainingMs = deadline - now，暂停投票、改票、推荐及自动计票。
                type: object
                required: [action, data]
                properties:
                  action: {type: string, enum: [pause]}
                  data: {type: object, additionalProperties: false}
                additionalProperties: false
              - title: 恢复
                description: 仅发起者可操作。恢复时按 deadline = now + remainingMs 重设截止时间。
                type: object
                required: [action, data]
                properties:
                  action: {type: string, enum: [resume]}
                  data: {type: object, additionalProperties: false}
                additionalProperties: false
