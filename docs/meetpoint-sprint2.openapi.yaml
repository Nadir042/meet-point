openapi: 3.0.3
info:
  title: MeetPoint Sprint 2 统一 API
  version: 2.0.0
  description: |-
    依据群内《MeetPoint Sprint 2 统一 API 交付文档》整理的目标契约。

    Mock 响应均为独立场景，使用示例成员、地点和票数。如需同一路径按 action 返回不同结果，在 Apifox 中用 Body 的 action、$.data.decision 等设置 Mock 期望。

    联调时待确认的约定

    - 活动操作成功响应暂沿用 data.activity；city 暂设为可选。
    - 申请列表条目、推荐 warnings 和历史状态完整枚举以联调结果为准。
    - INVALID_REQUEST、UNAUTHORIZED、ACTIVITY_NOT_FOUND 为通用错误示例。文档未逐项给出 HTTP 状态码和投票错误的可重试性，文件内对应映射供联调确认。
servers:
- url: http://127.0.0.1:3000
  description: 本地后端默认地址，待 Sprint 2 接口联调
tags:
- name: Sprint 2 地点与地图
- name: Sprint 2 活动需求
- name: Sprint 2 活动查询
- name: Sprint 2 活动操作
security:
- activityBearer: []
paths:
  /api/locations/search:
    get:
      tags: [Sprint 2 地点与地图]
      summary: 搜索地点
      operationId: searchLocations
      description: 搜索高德地点，后端最多返回 10 条，前端默认展示前 5 条。坐标为 GCJ-02。
      parameters:
      - name: keyword
        in: query
        required: true
        description: 地点关键词
        schema: {type: string, minLength: 1}
        example: 人民广场
      - name: city
        in: query
        required: false
        description: 检索城市；是否必填以服务端联调为准
        schema: {type: string}
        example: 上海
      responses:
        '200':
          description: 地点列表；无匹配时返回空数组
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, enum: [true]}
                  message: {type: string}
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Location'}, maxItems: 10}
              examples:
                found:
                  summary: 找到地点
                  value:
                    success: true
                    data:
                      items:
                      - {provider: amap, placeId: B000A8URXB, name: 人民广场, address: 上海市黄浦区人民大道, category: 地名地址信息, lng: 121.4752,
                        lat: 31.238}
                empty:
                  summary: 无匹配结果
                  value: {success: true, data: {items: []}}
        '400':
          description: 请求字段有误或前置资料不完整
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                INVALID_REQUEST:
                  summary: 请检查必填字段和字段格式
                  value: {success: false, error: {code: INVALID_REQUEST, message: 请检查必填字段和字段格式, retryable: false}}
        '401':
          description: 缺少或无效的 Bearer 令牌
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                UNAUTHORIZED:
                  summary: 活动令牌缺失或无效
                  value: {success: false, error: {code: UNAUTHORIZED, message: 活动令牌缺失或无效, retryable: false}}
        '429':
          description: 地图配额受限
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                MAP_QUOTA_EXCEEDED:
                  summary: 地图配额用尽
                  value: {success: false, error: {code: MAP_QUOTA_EXCEEDED, message: 地图配额用尽, retryable: false}}
        '502':
          description: 地图或路线服务返回异常
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                MAP_PROVIDER_ERROR:
                  summary: 地图服务返回异常
                  value: {success: false, error: {code: MAP_PROVIDER_ERROR, message: 地图服务返回异常, retryable: true}}
        '504':
          description: 地图服务超时
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                MAP_TIMEOUT:
                  summary: 地图服务超时
                  value: {success: false, error: {code: MAP_TIMEOUT, message: 地图服务超时, retryable: true}}
  /api/locations/reverse:
    get:
      tags: [Sprint 2 地点与地图]
      summary: 当前位置逆地理编码
      operationId: reverseLocation
      description: 用 GCJ-02 经纬度获取高德地点。前端在用户主动点击并授权定位后请求此接口。
      parameters:
      - name: lng
        in: query
        required: true
        description: 经度
        schema: {type: number, minimum: -180, maximum: 180, description: GCJ-02 经度}
        example: 121.4752
      - name: lat
        in: query
        required: true
        description: 纬度
        schema: {type: number, minimum: -90, maximum: 90, description: GCJ-02 纬度}
        example: 31.238
      responses:
        '200':
          description: 返回当前位置对应的地点
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, enum: [true]}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/Location'}
              examples:
                success:
                  summary: 返回人民广场
                  value:
                    success: true
                    data: {provider: amap, placeId: B000A8URXB, name: 人民广场, address: 上海市黄浦区人民大道, category: 地名地址信息, lng: 121.4752,
                      lat: 31.238}
        '400':
          description: 请求字段有误或前置资料不完整
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                INVALID_REQUEST:
                  summary: 请检查必填字段和字段格式
                  value: {success: false, error: {code: INVALID_REQUEST, message: 请检查必填字段和字段格式, retryable: false}}
        '401':
          description: 缺少或无效的 Bearer 令牌
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                UNAUTHORIZED:
                  summary: 活动令牌缺失或无效
                  value: {success: false, error: {code: UNAUTHORIZED, message: 活动令牌缺失或无效, retryable: false}}
        '429':
          description: 地图配额受限
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                MAP_QUOTA_EXCEEDED:
                  summary: 地图配额用尽
                  value: {success: false, error: {code: MAP_QUOTA_EXCEEDED, message: 地图配额用尽, retryable: false}}
        '502':
          description: 地图或路线服务返回异常
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                MAP_PROVIDER_ERROR:
                  summary: 地图服务返回异常
                  value: {success: false, error: {code: MAP_PROVIDER_ERROR, message: 地图服务返回异常, retryable: true}}
        '504':
          description: 地图服务超时
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                MAP_TIMEOUT:
                  summary: 地图服务超时
                  value: {success: false, error: {code: MAP_TIMEOUT, message: 地图服务超时, retryable: true}}
  /api/activities/{activityId}/requirements:
    put:
      tags: [Sprint 2 活动需求]
      summary: 保存本人出行需求
      operationId: saveRequirements
      description: |-
        只接受已从高德搜索或逆地理编码确认的地点。旧活动的 originIndex 需要重新选点。

        - 聚餐：不限、火锅、烧烤、中餐、西餐、咖啡甜品。
        - 休闲娱乐：不限、KTV、桌游、电影院、公园、商场、剧本杀、密室逃脱、美甲、手工、写真、拼豆。
        - 线下会面：不限、学习讨论、工作交流、朋友会面、安静场所、交通便利。
      parameters:
      - {$ref: '#/components/parameters/ActivityId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequirementsInput'}
            examples:
              save:
                summary: 公共交通，出发地设为私密
                value:
                  origin: {provider: amap, placeId: B000A8URXB, name: 人民广场, address: 上海市黄浦区人民大道, category: 地名地址信息, lng: 121.4752,
                    lat: 31.238}
                  mode: 公共交通
                  preference: 火锅
                  budget: 100
                  shared: false
      responses:
        '200':
          description: 返回当前请求者看到的活动
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityResponse'}
              examples:
                saved:
                  summary: 保存成功
                  value:
                    success: true
                    message: 出行需求已保存
                    data:
                      activity:
                        id: 00000000-0000-4000-8000-000000000001
                        round: 0
                        status: collecting
                        paused: false
                        deadline: null
                        remainingMs: null
                        winningCandidateId: null
                        members:
                        - id: member-1
                          name: 示例成员一
                          origin: {provider: amap, placeId: B000A8URXB, name: 人民广场, address: 上海市黄浦区人民大道, category: 地名地址信息,
                            lng: 121.4752, lat: 31.238}
                          originReady: true
                          shared: false
                        - {id: member-2, name: 示例成员二, origin: null, originReady: true, shared: false}
                        candidates: []
                        groups: {}
                        requests: []
                        voteStatus:
                          round: 0
                          status: collecting
                          paused: false
                          deadline: null
                          remainingMs: null
                          winningCandidateId: null
                          totalMembers: 2
                          votedMembers: 0
                          myVote: null
                          voteCounts: {}
                          allVoted: false
        '400':
          description: 请求字段有误或前置资料不完整
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                INVALID_REQUEST:
                  summary: 请检查必填字段和字段格式
                  value: {success: false, error: {code: INVALID_REQUEST, message: 请检查必填字段和字段格式, retryable: false}}
        '401':
          description: 缺少或无效的 Bearer 令牌
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                UNAUTHORIZED:
                  summary: 活动令牌缺失或无效
                  value: {success: false, error: {code: UNAUTHORIZED, message: 活动令牌缺失或无效, retryable: false}}
        '403':
          description: 当前身份无权限
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                NOT_ACTIVITY_MEMBER:
                  summary: 当前身份不是活动成员
                  value: {success: false, error: {code: NOT_ACTIVITY_MEMBER, message: 当前身份不是活动成员, retryable: false}}
        '404':
          description: 请求的资源不存在或已失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                ACTIVITY_NOT_FOUND:
                  summary: 活动不存在
                  value: {success: false, error: {code: ACTIVITY_NOT_FOUND, message: 活动不存在, retryable: false}}
  /api/activities/{activityId}:
